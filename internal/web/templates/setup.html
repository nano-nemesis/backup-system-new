<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — Backup System</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>(function(){ const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; })();</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
          <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
        </svg>
      </div>
      <div class="auth-logo-title">Initial Setup</div>
      <div class="auth-logo-sub">Create the first admin account</div>
    </div>

    {{if .Error}}
      <div class="alert alert-error" style="margin-bottom:.75rem">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{.Error}}
      </div>
    {{end}}

    <form class="auth-form" method="POST" action="/setup">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password <span class="text-muted text-sm">(min 8 chars)</span></label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <input class="form-input" type="password" id="confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.25rem">Create Admin Account</button>
    </form>
  </div>
</div>
</body>
</html>
